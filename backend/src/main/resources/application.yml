spring:
  application:
    name: crawler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crawler}
    username: ${DB_USERNAME:crawler}
    password: ${DB_PASSWORD:crawler}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: true

server:
  port: 8080

crawler:
  user-agent: "public-data-crawler/0.1 (+https://github.com/evenif99/public-data-crawler)"
  timeout-millis: 10000
  delay-millis: 1500        # 요청 사이 최소 간격
  korea-policy:
    base-url: ${KOREA_POLICY_BASE_URL:https://www.korea.kr}
    max-pages: 1
